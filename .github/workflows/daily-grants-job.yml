name: Daily Grants Promotion & Renewal Cron

on:
  schedule:
    # 6:00 AM Eastern Time = 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  run-daily-job:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger KYO Grants Daily Job
        run: |
          curl -X POST https://thekyo.ca/api/grants/daily-job \
            -H "Authorization: Bearer ${{ secrets.GRANTS_JOB_SECRET }}" \
            -H "Content-Type: application/json"
